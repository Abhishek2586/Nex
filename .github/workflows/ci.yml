name: NEXORA CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run lint (flake8)
      run: flake8 src/nexora

    - name: Run typecheck (mypy)
      run: mypy src/nexora --ignore-missing-imports

    - name: Bootstrap (generate tokens and runtime dirs)
      run: python scripts/bootstrap.py

    - name: Prepare core artifacts (data + models)
      run: python scripts/prepare_core.py

    - name: Doctor (verify imports and artifacts)
      run: python scripts/doctor.py

    - name: Run backend tests
      run: |
        mkdir -p /tmp/nexora-pytest-tmp reports
        pytest tests/ -v --junitxml=reports/pytest.xml --basetemp=/tmp/nexora-pytest-tmp


    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm run test


    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Run Playwright E2E tests
      run: python scripts/test_e2e.py

    - name: Build evidence package (last - captures E2E report)
      run: python scripts/build_evidence.py
